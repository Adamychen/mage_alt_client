name: Web client CI (Mage.Proxy/web)

on:
  push:
    paths:
      - 'Mage.Proxy/web/**'
      - 'Mage.Proxy/src/**'
      - 'Mage.Proxy/pom.xml'
      - 'scripts/**'
      - 'pom.xml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'Mage.Proxy/web/**'
      - 'Mage.Proxy/src/**'
      - 'Mage.Proxy/pom.xml'
      - 'scripts/**'
      - 'pom.xml'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mage.Proxy/web/package-lock.json
      - name: npm ci
        working-directory: Mage.Proxy/web
        run: npm ci
      - name: Unit tests (vitest)
        working-directory: Mage.Proxy/web
        run: npm run test
      - name: Coverage gate (vitest)
        working-directory: Mage.Proxy/web
        run: npm run test:coverage
      - name: Typecheck
        working-directory: Mage.Proxy/web
        run: npm run typecheck
      - name: Build
        working-directory: Mage.Proxy/web
        run: npm run build

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven proxy tests
        run: mvn -pl Mage.Proxy -am test

  integration:
    runs-on: ubuntu-latest
    needs: [web, proxy]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mage.Proxy/web/package-lock.json
      - name: npm ci
        working-directory: Mage.Proxy/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: Mage.Proxy/web
        run: npx playwright install --with-deps chromium
      - name: Build server, plugins and proxy
        run: node scripts/build.mjs
      - name: Start local stack
        run: node scripts/dev.mjs start
      - name: Run real self-tests and browser E2E
        run: node scripts/test.mjs self-test human-test e2e
      - name: Stop local stack
        if: always()
        run: node scripts/dev.mjs stop
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mage-proxy-integration-logs
          path: |
            .run/*.log
            Mage.Proxy/web/test-results/**
            Mage.Proxy/web/playwright-report/**
          if-no-files-found: ignore
